name: deploy-cloud-run

# One deploy path, same as scripts/deploy.sh: contract guard → backend tests →
# build gate → Cloud Build image → Cloud Run → verify the live URL.
#
# Auth: keyless workload identity, configured in the project already
# (pool "github", provider "github", service account github-deploy@ump-dashboard).
# The identifiers below are defaults, not secrets; every one can be overridden
# with a repository variable of the same name (Settings → Variables) — useful if
# the service is ever renamed or moved to another project.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy (blank = the branch you dispatched from)"
        required: false
        default: ""
      target:
        description: "What to ship"
        type: choice
        options: [both, frontend, backend]
        default: both
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/scripts/**"
      - "frontend/.env.production"
      - "scripts/**"
      - "content-pipeline/dist/**"
      - "Dockerfile"
      - ".github/workflows/deploy-cloud-run.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  # A second deploy never starts while one is running — Cloud Run updates would
  # otherwise race and the older image could land last.
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Auth to Google Cloud (workload identity)
        if: vars.GCP_USE_KEY != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/566076646952/locations/global/workloadIdentityPools/github/providers/github' }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || 'github-deploy@ump-dashboard.iam.gserviceaccount.com' }}

      - name: Auth to Google Cloud (service-account key)
        if: vars.GCP_USE_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT || 'ump-dashboard' }}

      - name: Show what will be deployed
        run: |
          echo "ref:    $(git rev-parse HEAD)"
          echo "commit: $(git log -1 --pretty=%s)"
          echo "target: ${{ github.event.inputs.target || 'both' }}"

      # The deploy gates need both toolchains: pytest for the backend suite,
      # npm for the SPA build-env guard (gate 0c reads .env.production).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Deploy
        env:
          PROJECT: ${{ vars.GCP_PROJECT || 'ump-dashboard' }}
          REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
          SERVICE: ${{ vars.GCP_SERVICE || 'ujjwal-pathak-app' }}
        # tee so the failing stage can be reported as an annotation below.
        # The runner runs bash with -o pipefail, so the exit code still propagates.
        shell: bash
        run: |
          set -o pipefail
          ./scripts/deploy.sh "${{ github.event.inputs.target || 'both' }}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      # Run logs are only downloadable from a host some clients cannot reach, so
      # the last lines of the deploy are echoed as an error annotation. That makes
      # the failing gate readable through the check-runs API, not just the UI.
      - name: Report failure detail
        if: failure()
        run: |
          if [ -s "$RUNNER_TEMP/deploy.log" ]; then
            detail=$(tail -n 25 "$RUNNER_TEMP/deploy.log" | tr '\n' '~' | sed 's/~/ /g' | cut -c1-5500)
            echo "::error title=Deploy failed — last 25 log lines::${detail}"
          else
            echo "::error title=Deploy failed::no output was captured from scripts/deploy.sh"
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Cloud Run deploy"
            echo ""
            echo "- commit: \`$(git rev-parse --short HEAD)\` $(git log -1 --pretty=%s)"
            echo "- target: \`${{ github.event.inputs.target || 'both' }}\`"
            echo "- result: \`${{ job.status }}\`"
            echo ""
            echo "The run ends with \`scripts/verify-deploy.sh\`, which fails the job if the"
            echo "served bundle is stale (it asserts the \`access-toggle-\` marker is present)."
          } >> "$GITHUB_STEP_SUMMARY"
