# Fly.io deployment — builds the repo-root Dockerfile (API + mentor SPA).
#   fly launch --no-deploy --copy-config    # first time (pick a name/region)
#   fly secrets set MONGO_URL="..." JWT_SECRET="..." MENTOR_ACCOUNTS="..."
#   fly deploy
app = "ujjwal-pathak-app"
primary_region = "sin"               # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DB_NAME = "ujjwal_pathak"
  DEV_AUTH_BYPASS = "0"
  IMPORT_GENERATED = "1"
  GENERATED_DIR = "../content-pipeline/generated"
  CORS_ORIGINS = "*"
# Secrets (MONGO_URL, JWT_SECRET, MENTOR_ACCOUNTS, STUDENT_IMPORT_KEY,
# SYNC_SECRET, WHATSAPP_*, ACCOUNT_RESET_SHEET_PASSWORDS) are set with
# `fly secrets set` — encrypted at rest, injected at runtime, never in Git.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"     # "off" = always-on, no cold start
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
